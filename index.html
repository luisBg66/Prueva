<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Clasificador Híbrido (Estático + Webcam)</title>

    <!-- Dependencias de TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>📸 Entrenamiento Estático & 📹 Detección en Vivo</h1>

  <div class="wrap">
    <div class="camera">
      <!-- 1. Contenedor visual: Puede mostrar la Imagen Estática O el Video -->
      <div id="visual-container">
          <img id="preview" style="display: block;">
          <video id="webcam" autoplay muted playsinline style="display: none;"></video>
      </div>

      <!-- Controles de Fuente -->
      <div class="source-controls" style="text-align: center; margin-top: 5px;">
          <input type="file" id="image-upload" accept="image/*" multiple onchange="handleFiles(event)" style="display: none;">
          <button onclick="document.getElementById('image-upload').click()" class="secondary">📂 Subir Imágenes</button>
          <button id="btnWebcam" class="secondary">📹 Activar Webcam</button>
      </div>
    </div>

    <div class="panel">
      
      <!-- Sección de Predicción en Vivo -->
      <div class="row">
        <div>Objeto detectado: <span id="prediccion" style="font-size: 1.2em; color: #22c55e;">-</span></div>
      </div>
      
      <h2>Entrenamiento (Imágenes)</h2>
      <div class="row">
        <label for="clase">Nombre:</label>
        <input id="clase" type="text" placeholder="Ej: taza" />
        <button id="btnCapturar" disabled>📸 Capturar (Estático)</button>
      </div>
      
      <div class="row">
        <button id="btnEntrenar" disabled>🧠 Entrenar Modelo</button>
        <button id="btnGuardarLocal" class="secondary" disabled>💾 Guardar</button>
      </div>

      <div class="row">
        <button id="btnPredecirEstático" disabled>🖼️ Identificar Foto</button>
      </div>
      
      <!-- Gestión de Archivos -->
      <details>
        <summary>Gestión de Muestras y Modelo</summary>
        <div class="row">
            <button id="btnExportarMuestras" class="secondary">⬇️ Exp. Muestras</button>
            <button id="btnImportarMuestras" class="secondary">⬆️ Imp. Muestras</button>
        </div>
        <div class="row">
            <button id="btnExportarModelo" class="secondary">⬇️ Exp. Modelo</button>
        </div>
      </details>
      
      <div class="row">
        <small id="muestrasInfo">Muestras capturadas: 0</small>
      </div>
      
      <div id="status" class="smallcenter">Inicializando...</div>

      <hr>

      <h2>Traducciones</h2>
      <div id="results">
        <p><strong>Español:</strong> <span id="es_text">--</span></p>
        <p><strong>Purépecha:</strong> <span id="purepecha_text">--</span></p>
        <p><strong>Maya:</strong> <span id="maya_text">--</span></p>
        <p><strong>Otomí:</strong> <span id="otomi_text">--</span></p>
      </div>
      
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
