<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Clasificador de Objetos Estático (TF.js)</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>📸 Entrenamiento Estático de Objetos</h1>

  <div class="wrap">
    <div class="camera">
      <input type="file" id="image-upload" accept="image/*" multiple onchange="handleFiles(event)">
      <img id="preview" style="max-height: 480px; max-width: 640px; margin: 10px auto;">
    </div>

    <div class="panel">
      
      <div class="row">
        <div>Objeto detectado: <span id="prediccion">-</span></div>
      </div>
      
      <h2>Capturar Muestras</h2>
      <div class="row">
        <label for="clase">Nombre del Objeto:</label>
        <input id="clase" type="text" placeholder="Ej: taza, silla" />
        <button id="btnCapturar" disabled>📸 Capturar Muestras</button>
      </div>
      
      <div class="row">
        <button id="btnEntrenar" disabled>🧠 Entrenar Modelo</button>
        <button id="btnGuardar" class="secondary" disabled>💾 Guardar Modelo</button>
      </div>
      
      <div class="row">
        <button id="btnPredecir" disabled>🚀 Identificar Objeto</button>
      </div>

      <div class="row">
        <small id="muestrasInfo">Muestras capturadas: 0</small>
      </div>
      
      <div id="status" class="smallcenter">Inicializando modelo...</div>

      <hr>

      <h2>Traducciones</h2>
      <div id="results">
        <p><strong>Español:</strong> <span id="es_text">--</span></p>
        <p><strong>Purépecha:</strong> <span id="purepecha_text">--</span></p>
        <p><strong>Maya:</strong> <span id="maya_text">--</span></p>
        <p><strong>Otomí:</strong> <span id="otomi_text">--</span></p>
      </div>
      
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
