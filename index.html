<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MobileNet en Video (Detección Simple)</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
  
  <style>
    body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; }
    #video { display: none; } /* Ocultamos el video, usaremos el canvas */
    #canvas { border: 2px solid #58a6ff; }
  </style>
</head>
<body>
  <h1>🎥 Clasificación Simple con MobileNet</h1>

  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>

  <div id="status">Cargando modelos...</div>
  <div id="prediction"></div>

  <script src="app.js"></script>
</body>
</html>
